info:
  name: Create Backup
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/backups?scope={{backup_scope}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.body || {};
        const jobId = body.jobId;
        if (jobId) {
          bru.setVar("job_id", String(jobId));
        }
    - type: tests
      code: |-
        test("create backup is accepted", function () {
          expect(res.status).to.equal(202);
        });

        test("create backup returns job id", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.jobId).to.be.a("string");
          expect(res.body.jobId.length).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
