info:
  name: Restore Backup
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/backups/{{backup_name}}/restore"
  body:
    type: json
    data: |-
      {
        "targetStore": "{{restore_target_store}}",
        "mode": "{{restore_mode}}",
        "dryRun": {{restore_dry_run}},
        "force": {{restore_force}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
