info:
  name: Complete Setup
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/setup/complete"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("setup completion requires valid auth", function () {
          expect(res.status).to.not.equal(401);
        });

        test("setup completion returns expected status", function () {
          expect(res.status).to.be.oneOf([200, 204, 400, 409]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
