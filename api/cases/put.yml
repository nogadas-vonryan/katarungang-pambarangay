info:
  name: Put Case Record
  type: http
  seq: 25

http:
  method: PUT
  url: "{{base_url}}/v1/cases/records/{{case_id}}"
  headers:
    - name: If-Match
      value: "{{case_etag}}"
  body:
    type: json
    data: |-
      {
        "title": "Updated case title",
        "status": "mediation",
        "priority": "medium",
        "complainants": [
          "Complainant A"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const etag = res.getHeader("etag") || res.getHeader("ETag");
        if (etag) {
          bru.setVar("case_etag", String(etag));
        }
    - type: tests
      code: |-
        test("put case returns 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
