info:
  name: Get One Case Record
  type: http
  seq: 23

http:
  method: GET
  url: "{{base_url}}/v1/cases/records/{{case_id}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const etag = res.getHeader("etag") || res.getHeader("ETag");
        if (etag) {
          bru.setVar("case_etag", String(etag));
        }
    - type: tests
      code: |-
        test("get case returns 200", function () {
          expect(res.status).to.equal(200);
        });

        test("get case returns matching id", function () {
          const expected = bru.getVar("case_id") || bru.getEnvVar("case_id");
          expect(res.body.id).to.equal(expected);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
