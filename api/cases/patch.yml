info:
  name: Patch Case Record
  type: http
  seq: 27

http:
  method: PATCH
  url: "{{base_url}}/v1/cases/records/{{case_id}}"
  headers:
    - name: If-Match
      value: "{{case_etag}}"
  body:
    type: json
    data: |-
      {
        "status": "arbitration",
        "priority": "high"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
