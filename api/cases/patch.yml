info:
  name: Patch Case Record
  type: http
  seq: 27

http:
  method: PATCH
  url: "{{base_url}}/v1/{{store_name}}/records/{{case_id}}"
  headers:
    - name: If-Match
      value: "{{case_etag}}"
  body:
    type: json
    data: |-
      {
        "status": "arbitration",
        "priority": "high"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const etag = res.getHeader("etag") || res.getHeader("ETag");
        if (etag) {
          bru.setVar("case_etag", String(etag));
        }
    - type: tests
      code: |-
        test("patch case returns 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
