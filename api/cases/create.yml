info:
  name: Create Case Record
  type: http
  seq: 21

http:
  method: POST
  url: "{{base_url}}/v1/cases/records"
  body:
    type: json
    data: |-
      {
        "title": "Sample case",
        "status": "filed",
        "priority": "low",
        "complainants": [
          "Complainant A",
          "Complainant B"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
