info:
  name: Login
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{auth_username}}",
        "password": "{{auth_password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.body || {};
        const token = body.token || body.accessToken || body.authToken;
        if (token) {
          bru.setVar("auth_token", String(token));
        }
    - type: tests
      code: |-
        test("login succeeds", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
