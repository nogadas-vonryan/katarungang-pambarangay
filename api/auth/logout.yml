info:
  name: Logout
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/auth/logout"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.deleteVar("auth_token");
    - type: tests
      code: |-
        test("logout returns success status", function () {
          expect(res.status).to.be.oneOf([200, 204]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
