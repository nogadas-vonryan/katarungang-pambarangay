info:
  name: Upload File
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/cases/records/{{case_id}}/files"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - test-fixtures/placeholder.png
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("upload file returns created", function () {
          expect(res.status).to.equal(201);
        });

        test("upload response returns uploaded filename", function () {
          expect(res.body).to.be.an("object");
          expect(res.body.name).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
