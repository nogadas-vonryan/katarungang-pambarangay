info:
  name: Upload File
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/cases/records/{{case_id}}/files"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - test-fixtures/placeholder.png
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
