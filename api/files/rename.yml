info:
  name: Rename File
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/v1/{{store_name}}/records/{{case_id}}/files/{{test_filename}}"
  body:
    type: json
    data: |-
      {
        "name": "{{renamed_test_filename}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const current = bru.getVar("test_filename") || bru.getEnvVar("test_filename");
          const renamed = bru.getVar("renamed_test_filename") || bru.getEnvVar("renamed_test_filename");
          if (renamed) {
            bru.setVar("test_filename", String(renamed));
          }
          if (current) {
            bru.setVar("renamed_test_filename", String(current));
          }
        }
    - type: tests
      code: |-
        test("rename file returns 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
